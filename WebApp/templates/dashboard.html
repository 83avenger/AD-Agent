<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AD-Agent — Security Operations Dashboard</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0b1120; --panel:#131c2e; --panel2:#0f1626;
    --border:#223049; --text:#e6edf7; --muted:#8595ad;
    --critical:#ef4444; --high:#f97316; --medium:#eab308; --low:#38bdf8; --success:#22c55e;
    --accent:#3b82f6;
  }
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(1200px 800px at 20% -10%,#16233b 0%,var(--bg) 55%);
    color:var(--text); overflow:hidden; height:100vh; display:flex; flex-direction:column;
  }

  /* Header */
  header{
    display:flex; align-items:center; gap:1rem; padding:.9rem 1.6rem;
    border-bottom:1px solid var(--border); background:rgba(9,14,25,.6); backdrop-filter:blur(6px);
  }
  header .brand{display:flex; align-items:center; gap:.6rem; font-weight:800; font-size:1.15rem; letter-spacing:.2px}
  header .brand svg{color:var(--accent)}
  header .sub{color:var(--muted); font-size:.8rem; font-weight:500}
  header .spacer{margin-left:auto}
  header .clock{font-variant-numeric:tabular-nums; font-weight:700; font-size:1.05rem}
  .demo-badge{background:var(--medium); color:#1a1400; font-weight:800; font-size:.7rem;
    padding:.25rem .55rem; border-radius:6px; letter-spacing:.4px}

  /* Stage */
  .stage{position:relative; flex:1; overflow:hidden}
  .screen{position:absolute; inset:0; padding:1.4rem 1.8rem; opacity:0; transform:translateY(14px) scale(.995);
    transition:opacity .6s ease, transform .6s ease; pointer-events:none; display:flex; flex-direction:column; gap:1.1rem}
  .screen.active{opacity:1; transform:none; pointer-events:auto}
  .screen h2{font-size:1.1rem; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:1.5px;
    display:flex; align-items:center; gap:.6rem}
  .screen h2 .fresh{margin-left:auto; font-size:.72rem; font-weight:600; text-transform:none; letter-spacing:0; color:var(--muted)}

  /* Generic pieces */
  .grid{display:grid; gap:1.1rem}
  .panel{background:linear-gradient(180deg,var(--panel) 0%,var(--panel2) 100%); border:1px solid var(--border);
    border-radius:14px; padding:1.1rem 1.2rem; min-height:0}
  .panel .ph{font-size:.78rem; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin-bottom:.7rem; font-weight:700}

  /* KPI tiles */
  .kpis{display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:1.1rem}
  .kpi{position:relative; overflow:hidden; padding:1.3rem 1.3rem 1.1rem}
  .kpi .num{font-size:clamp(2.6rem,5vw,4rem); font-weight:800; line-height:1; font-variant-numeric:tabular-nums}
  .kpi .lbl{color:var(--muted); font-size:.85rem; font-weight:600; margin-top:.5rem}
  .kpi .tag{position:absolute; top:1.1rem; right:1.1rem; font-size:.7rem; font-weight:800; padding:.2rem .5rem; border-radius:6px}
  .kpi::after{content:""; position:absolute; left:0; bottom:0; height:4px; width:100%; opacity:.9}
  .kpi.c-critical::after{background:var(--critical)} .kpi.c-high::after{background:var(--high)}
  .kpi.c-medium::after{background:var(--medium)} .kpi.c-good::after{background:var(--success)}
  .kpi.c-accent::after{background:var(--accent)}

  /* Posture banner */
  .posture{border-radius:14px; padding:1rem 1.3rem; display:flex; align-items:center; gap:1rem; font-weight:700; border:1px solid var(--border)}
  .posture .dot{width:14px; height:14px; border-radius:50%; box-shadow:0 0 14px currentColor}
  .posture.p-critical{background:rgba(239,68,68,.12); color:var(--critical)}
  .posture.p-warn{background:rgba(234,179,8,.12); color:var(--medium)}
  .posture.p-good{background:rgba(34,197,94,.12); color:var(--success)}
  .posture .txt{color:var(--text)}
  .posture .txt b{color:inherit}

  /* Severity bar */
  .sevbar{display:flex; height:26px; border-radius:8px; overflow:hidden; border:1px solid var(--border)}
  .sevbar span{display:flex; align-items:center; justify-content:center; font-size:.72rem; font-weight:800; color:#0b1120; min-width:0}
  .sev-legend{display:flex; gap:1.2rem; margin-top:.7rem; flex-wrap:wrap}
  .sev-legend div{display:flex; align-items:center; gap:.4rem; font-size:.8rem; color:var(--muted); font-weight:600}
  .swatch{width:11px; height:11px; border-radius:3px; display:inline-block}

  /* Gauge */
  .gauge-wrap{display:flex; align-items:center; gap:1.4rem}
  .gauge{position:relative; width:190px; height:190px; flex:none}
  .gauge .val{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center}
  .gauge .val .n{font-size:2.8rem; font-weight:800; line-height:1}
  .gauge .val .u{font-size:.8rem; color:var(--muted); font-weight:600}

  /* Lists / rows */
  .rows{display:flex; flex-direction:column; gap:.55rem; overflow:hidden}
  .row{display:flex; align-items:center; gap:.7rem; padding:.5rem .7rem; background:rgba(255,255,255,.02);
    border:1px solid var(--border); border-radius:9px}
  .row .badge{font-size:.66rem; font-weight:800; padding:.16rem .45rem; border-radius:5px; color:#0b1120; flex:none}
  .row .title{font-weight:600; font-size:.9rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .row .meta{margin-left:auto; color:var(--muted); font-size:.78rem; white-space:nowrap; flex:none}
  .row .cve{font-family:ui-monospace,Menlo,Consolas,monospace; font-weight:700; font-size:.82rem; flex:none}
  .ransom{background:var(--critical); color:#fff; font-size:.62rem; font-weight:800; padding:.12rem .4rem; border-radius:4px; flex:none}

  /* horizontal count bars */
  .hbars{display:flex; flex-direction:column; gap:.6rem}
  .hbar{display:grid; grid-template-columns:130px 1fr 40px; align-items:center; gap:.6rem; font-size:.82rem}
  .hbar .lab{color:var(--muted); font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .hbar .track{height:14px; background:rgba(255,255,255,.05); border-radius:7px; overflow:hidden}
  .hbar .fill{height:100%; border-radius:7px}
  .hbar .cnt{text-align:right; font-weight:800; font-variant-numeric:tabular-nums}

  .countdown{font-weight:800; font-variant-numeric:tabular-nums; flex:none}
  .empty{color:var(--muted); font-size:.9rem; padding:1rem; text-align:center}

  table.mini{width:100%; border-collapse:collapse; font-size:.82rem}
  table.mini th{text-align:left; color:var(--muted); font-weight:700; font-size:.72rem; text-transform:uppercase;
    letter-spacing:.5px; padding:.35rem .5rem; border-bottom:1px solid var(--border)}
  table.mini td{padding:.4rem .5rem; border-bottom:1px solid rgba(255,255,255,.04)}

  /* Footer / rotation */
  footer{display:flex; align-items:center; gap:1rem; padding:.7rem 1.6rem; border-top:1px solid var(--border);
    background:rgba(9,14,25,.6)}
  .dots{display:flex; gap:.5rem}
  .dots button{width:11px; height:11px; border-radius:50%; border:1px solid var(--border); background:transparent;
    cursor:pointer; padding:0; transition:all .3s}
  .dots button.on{background:var(--accent); border-color:var(--accent); transform:scale(1.25)}
  .screen-name{font-weight:700; font-size:.9rem}
  .progress{flex:1; height:5px; background:rgba(255,255,255,.08); border-radius:3px; overflow:hidden; max-width:520px; margin:0 auto}
  .progress .bar{height:100%; width:0; background:linear-gradient(90deg,var(--accent),#60a5fa)}
  .ctrl{color:var(--muted); font-size:.78rem; font-weight:600; display:flex; align-items:center; gap:.4rem}
  .ctrl kbd{background:var(--panel); border:1px solid var(--border); border-radius:4px; padding:.05rem .35rem; font-size:.72rem}
  .paused-flag{color:var(--medium); font-weight:800}

  /* Device detail modal */
  .clickable-row{cursor:pointer}
  .clickable-row:hover{background:rgba(255,255,255,.04)}
  .modal-backdrop{position:fixed; inset:0; background:rgba(3,6,14,.7); backdrop-filter:blur(2px);
    display:flex; align-items:center; justify-content:center; z-index:50}
  .modal-backdrop.hidden{display:none}
  .modal{background:linear-gradient(180deg,var(--panel) 0%,var(--panel2) 100%); border:1px solid var(--border);
    border-radius:14px; width:min(720px,92vw); max-height:82vh; display:flex; flex-direction:column; overflow:hidden}
  .modal-head{display:flex; align-items:center; gap:.8rem; padding:1rem 1.3rem; border-bottom:1px solid var(--border)}
  .modal-head h3{font-size:1.05rem}
  .modal-head .close{margin-left:auto; cursor:pointer; color:var(--muted); font-size:1.3rem; line-height:1; background:none; border:none}
  .modal-head .close:hover{color:var(--text)}
  .modal-body{padding:1.1rem 1.3rem; overflow:auto}
  .modal-meta{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:.7rem; margin-bottom:1.1rem}
  .modal-meta div{background:rgba(255,255,255,.02); border:1px solid var(--border); border-radius:8px; padding:.55rem .7rem}
  .modal-meta .k{color:var(--muted); font-size:.7rem; text-transform:uppercase; letter-spacing:.5px; font-weight:700}
  .modal-meta .v{font-weight:700; margin-top:.15rem}
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
    AD-Agent <span class="sub">Security Operations</span>
  </div>
  <div class="spacer"></div>
  <span id="demoBadge" class="demo-badge" style="display:none">DEMO DATA</span>
  <div class="clock" id="clock">--:--:--</div>
</header>

<div class="stage" id="stage">
  <section class="screen" data-name="Executive Overview"></section>
  <section class="screen" data-name="Network Discovery"></section>
  <section class="screen" data-name="Compliance Posture"></section>
  <section class="screen" data-name="Threats &amp; Anomalies"></section>
  <section class="screen" data-name="Certificate Expiry"></section>
  <section class="screen" data-name="Software Inventory"></section>
</div>

<div class="modal-backdrop hidden" id="deviceModal" onclick="if(event.target===this) closeDeviceModal()">
  <div class="modal">
    <div class="modal-head">
      <h3 id="deviceModalTitle">Device</h3>
      <button class="close" onclick="closeDeviceModal()" aria-label="Close">&times;</button>
    </div>
    <div class="modal-body" id="deviceModalBody"></div>
  </div>
</div>

<footer>
  <div class="dots" id="dots"></div>
  <span class="screen-name" id="screenName">—</span>
  <div class="progress"><div class="bar" id="progressBar"></div></div>
  <span class="ctrl">
    <span id="pausedFlag" class="paused-flag" style="display:none">❚❚ PAUSED</span>
    <kbd>Space</kbd> pause <kbd>←</kbd><kbd>→</kbd> nav <kbd>F</kbd> full
  </span>
</footer>

<script>
const SCREENS = document.querySelectorAll('.screen');
const DOTS = document.getElementById('dots');
const N = SCREENS.length;
const ROTATE_MS = 13000;
const REFRESH_MS = 180000;
let idx = 0, paused = false, tickStart = 0, rafId = null, data = null;

const SEV = {Critical:'var(--critical)', High:'var(--high)', Medium:'var(--medium)', Low:'var(--low)'};
const SEV_ORDER = ['Critical','High','Medium','Low'];

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function sevColor(s){ return SEV[s] || 'var(--muted)'; }
function timeAgo(iso){
  if(!iso) return '—';
  const t = new Date(iso).getTime(); if(isNaN(t)) return '—';
  const m = Math.max(0, Math.round((Date.now()-t)/60000));
  if(m<1) return 'just now'; if(m<60) return m+'m ago';
  const h=Math.floor(m/60); if(h<24) return h+'h ago'; return Math.floor(h/24)+'d ago';
}
function sevBar(counts){
  const total = SEV_ORDER.reduce((a,s)=>a+(counts[s]||0),0);
  if(!total) return '<div class="empty">No findings 🎉</div>';
  let html='<div class="sevbar">';
  SEV_ORDER.forEach(s=>{ const c=counts[s]||0; if(!c) return;
    const w=(c/total*100).toFixed(1);
    html+=`<span style="width:${w}%;background:${sevColor(s)}">${c}</span>`; });
  html+='</div><div class="sev-legend">';
  SEV_ORDER.forEach(s=>{ html+=`<div><span class="swatch" style="background:${sevColor(s)}"></span>${s} · ${counts[s]||0}</div>`; });
  return html+'</div>';
}
function hbars(pairs, colorFn){
  const max = Math.max(1, ...pairs.map(p=>p[1]));
  if(!pairs.length) return '<div class="empty">Nothing to show</div>';
  return '<div class="hbars">'+pairs.map(([lab,cnt])=>{
    const w=(cnt/max*100).toFixed(0); const col=colorFn?colorFn(lab):'var(--accent)';
    return `<div class="hbar"><span class="lab" title="${esc(lab)}">${esc(lab)}</span>
      <div class="track"><div class="fill" style="width:${w}%;background:${col}"></div></div>
      <span class="cnt">${cnt}</span></div>`;
  }).join('')+'</div>';
}

/* ── Screen renderers ─────────────────────────────────────────────── */
function renderOverview(d){
  const k=d.kpi, f=d.freshness||{};
  const score = k.compliance_score==null?'—':k.compliance_score+'%';
  const postureTxt = {critical:'Critical exposure — immediate action required',
    warn:'Attention needed — findings above baseline', good:'Healthy — no critical findings'}[d.posture];
  return `
   <h2>Executive Overview <span class="fresh">Anomalies ${timeAgo(f.Anomalies)} · Compliance ${timeAgo(f.Compliance)} · Certs ${timeAgo(f.Certificates)} · Zero-day ${timeAgo(f.ZeroDay)} · Software ${timeAgo(f.SoftwareInventory)}</span></h2>
   <div class="posture p-${d.posture}"><span class="dot"></span><span class="txt"><b>${d.posture.toUpperCase()}</b> &nbsp;·&nbsp; ${postureTxt}</span></div>
   <div class="kpis">
     <div class="panel kpi c-${k.anomalies?'high':'good'}"><div class="num">${k.anomalies}</div><div class="lbl">Security Anomalies</div></div>
     <div class="panel kpi c-accent"><div class="num">${score}</div><div class="lbl">Compliance Score · ${k.compliance_passed}/${k.compliance_total} passing</div></div>
     <div class="panel kpi c-${k.zerodays?'critical':'good'}"><div class="num">${k.zerodays}</div><div class="lbl">Active Zero-Day Alerts</div></div>
     <div class="panel kpi c-${k.certs_urgent?'critical':(k.certs?'medium':'good')}"><div class="num">${k.certs}</div><div class="lbl">Expiring Certificates · ${k.certs_urgent} &lt; 30 days</div></div>
     <div class="panel kpi c-${k.software_vulnerable?'critical':'good'}"><div class="num">${k.software_hosts}</div><div class="lbl">Hosts Inventoried · ${k.software_vulnerable} zero-day exposure(s)</div></div>
   </div>
   <div class="panel"><div class="ph">Open findings by severity (all sources)</div>${sevBar(d.severity_totals)}</div>`;
}

function gauge(score){
  const s = score==null?0:Math.max(0,Math.min(100,score));
  const r=82, c=2*Math.PI*r, off=c*(1-s/100);
  const col = s>=80?'var(--success)':(s>=60?'var(--medium)':'var(--critical)');
  return `<div class="gauge">
    <svg width="190" height="190" viewBox="0 0 190 190">
      <circle cx="95" cy="95" r="${r}" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="14"/>
      <circle cx="95" cy="95" r="${r}" fill="none" stroke="${col}" stroke-width="14" stroke-linecap="round"
        stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 95 95)"/>
    </svg>
    <div class="val"><div class="n" style="color:${col}">${score==null?'—':score+'%'}</div><div class="u">compliant</div></div>
  </div>`;
}
function renderCompliance(d){
  const c=d.compliance, sum=c.summary||{}, f=d.freshness||{};
  const gapsList = c.top_gaps.length ? c.top_gaps.map(g=>`
    <div class="row"><span class="badge" style="background:${sevColor(g.Severity)}">${esc(g.Severity)}</span>
      <span class="title" title="${esc(g.Title)}">${esc(g.ControlId)} · ${esc(g.Title)}</span>
      <span class="meta">${esc(g.ComputerName||'')}</span></div>`).join('')
    : '<div class="empty">✅ No compliance gaps</div>';
  const byDc = (c.by_dc||[]).slice(0,6).map(r=>`<tr><td>${esc(r.DC)}</td><td>${r.Passed}/${r.Total}</td>
     <td style="color:${r.ScorePct>=80?'var(--success)':(r.ScorePct>=60?'var(--medium)':'var(--critical)')};font-weight:700">${r.ScorePct}%</td></tr>`).join('')
     || '<tr><td colspan="3" class="empty">No asset breakdown</td></tr>';
  return `
   <h2>Compliance Posture <span class="fresh">updated ${timeAgo(f.Compliance)}</span></h2>
   <div class="grid" style="grid-template-columns:1fr 1.3fr; flex:1; min-height:0">
     <div class="panel"><div class="ph">Overall score</div>
       <div class="gauge-wrap">${gauge(sum.ScorePct==null?null:sum.ScorePct)}
         <div style="flex:1">
           <div style="font-size:.85rem;color:var(--muted);margin-bottom:.5rem">${sum.Passed||0} passing · ${sum.Failed||0} failing · ${sum.TotalControls||0} controls</div>
           ${sevBar(c.gaps_by_severity)}
         </div></div>
       <div class="ph" style="margin-top:1.1rem">By asset</div>
       <table class="mini"><thead><tr><th>Host</th><th>Passed</th><th>Score</th></tr></thead><tbody>${byDc}</tbody></table>
     </div>
     <div class="panel" style="display:flex;flex-direction:column;min-height:0">
       <div class="ph">Top compliance gaps</div>
       <div class="rows" style="overflow:auto">${gapsList}</div>
     </div>
   </div>`;
}

function renderThreats(d){
  const t=d.threats, f=d.freshness||{};
  const anom = t.recent_anomalies.length ? t.recent_anomalies.map(a=>`
    <div class="row"><span class="badge" style="background:${sevColor(a.Severity||'High')}">${esc(a.Severity||'High')}</span>
      <span class="title" title="${esc(a.Detail||'')}">${esc(a.Type||'')} · ${esc(a.Account||'—')}</span>
      <span class="meta">${esc((a.ComputerName||''))}</span></div>`).join('')
    : '<div class="empty">✅ No anomalies in window</div>';
  const zd = t.zerodays.length ? t.zerodays.map(z=>{
    const ransom = String(z.KnownRansomwareCampaignUse||'').toLowerCase()==='known';
    return `<div class="row">
      <span class="cve" style="color:${ransom?'var(--critical)':'var(--high)'}">${esc(z.CveId)}</span>
      ${ransom?'<span class="ransom">RANSOMWARE</span>':''}
      <span class="title" title="${esc(z.VulnerabilityName||'')}">${esc(z.Product||z.VendorProject||'')} · ${esc(z.VulnerabilityName||'')}</span>
      <span class="meta">due ${esc(z.DueDate||'—')}</span></div>`;}).join('')
    : '<div class="empty">✅ No new zero-day matches</div>';
  return `
   <h2>Threats &amp; Anomalies <span class="fresh">Anomalies ${timeAgo(f.Anomalies)} · Zero-day ${timeAgo(f.ZeroDay)}</span></h2>
   <div class="grid" style="grid-template-columns:1fr 1fr; flex:1; min-height:0">
     <div class="panel" style="display:flex;flex-direction:column;min-height:0">
       <div class="ph">Anomalies by type</div>
       ${hbars(t.anomaly_types, ()=> 'var(--high)')}
       <div class="ph" style="margin-top:1.1rem">Recent anomalies</div>
       <div class="rows" style="overflow:auto">${anom}</div>
     </div>
     <div class="panel" style="display:flex;flex-direction:column;min-height:0">
       <div class="ph">Zero-day watchlist (CISA KEV / NVD)</div>
       <div class="rows" style="overflow:auto">${zd}</div>
     </div>
   </div>`;
}

function renderCerts(d){
  const c=d.certificates, f=d.freshness||{};
  const list = c.soonest.length ? c.soonest.map(x=>{
    const dr = x.DaysRemaining;
    const col = dr<0?'var(--critical)':sevColor(x.Severity);
    const txt = dr<0?`EXPIRED ${Math.abs(dr)}d`:`${dr}d`;
    return `<div class="row"><span class="badge" style="background:${sevColor(x.Severity)}">${esc(x.Severity)}</span>
      <span class="title" title="${esc(x.Subject)}">${esc(x.Subject)}</span>
      <span class="meta">${esc(x.Sources||'')}</span>
      <span class="countdown" style="color:${col}">${txt}</span></div>`;}).join('')
    : '<div class="empty">✅ No certificates expiring within threshold</div>';
  return `
   <h2>Certificate Expiry <span class="fresh">updated ${timeAgo(f.Certificates)}</span></h2>
   <div class="grid" style="grid-template-columns:.9fr 1.6fr; flex:1; min-height:0">
     <div class="panel"><div class="ph">By severity</div>${sevBar(c.by_severity)}
       <div style="margin-top:1.4rem;text-align:center">
         <div style="font-size:3.4rem;font-weight:800;color:${c.urgent_count?'var(--critical)':'var(--success)'}">${c.urgent_count}</div>
         <div style="color:var(--muted);font-weight:600">expiring in &lt; 30 days</div></div>
     </div>
     <div class="panel" style="display:flex;flex-direction:column;min-height:0">
       <div class="ph">Soonest to expire</div>
       <div class="rows" style="overflow:auto">${list}</div>
     </div>
   </div>`;
}

function renderSoftware(d){
  const sw=d.software, f=d.freshness||{};
  const catPairs = Object.entries(sw.by_category||{}).sort((a,b)=>b[1]-a[1]);
  const catCatalog = {'Domain Controller':'var(--critical)','Server':'var(--high)','Desktop':'var(--accent)','Laptop':'var(--low)','Workstation':'var(--medium)'};
  const vulnList = sw.vulnerable.length ? sw.vulnerable.map(h=>{
    const ransom = String(h.KnownRansomwareCampaignUse||'').toLowerCase()==='known';
    return `<div class="row">
      <span class="cve" style="color:${ransom?'var(--critical)':'var(--high)'}">${esc(h.CveId)}</span>
      ${ransom?'<span class="ransom">RANSOMWARE</span>':''}
      <span class="title" title="${esc(h.SoftwareName)}">${esc(h.SoftwareName)} ${esc(h.SoftwareVersion)} on ${esc(h.ComputerName)}</span>
      <span class="meta">${esc(h.Category||'')}</span></div>`;}).join('')
    : '<div class="empty">✅ No zero-day exposure found in installed software</div>';
  const prodPairs = (sw.top_products||[]).slice(0,8);
  return `
   <h2>Software Inventory <span class="fresh">updated ${timeAgo(f.SoftwareInventory)}</span></h2>
   <div class="grid" style="grid-template-columns:1fr 1fr; flex:1; min-height:0">
     <div class="panel" style="display:flex;flex-direction:column;min-height:0">
       <div class="ph">Hosts by category (${sw.host_count} total)</div>
       ${hbars(catPairs, (lab)=>catCatalog[lab]||'var(--accent)')}
       <div class="ph" style="margin-top:1.1rem">Top installed products</div>
       ${hbars(prodPairs, ()=>'var(--low)')}
     </div>
     <div class="panel" style="display:flex;flex-direction:column;min-height:0">
       <div class="ph">Zero-day exposure via installed software</div>
       <div class="rows" style="overflow:auto">${vulnList}</div>
     </div>
   </div>`;
}

function onlineBadge(lastSeen){
  const t = lastSeen ? new Date(lastSeen).getTime() : NaN;
  const online = !isNaN(t) && (Date.now()-t) <= 20*60*1000;
  return online
    ? `<span style="color:var(--success);font-weight:800">&#9679; Online</span>`
    : `<span style="color:var(--muted)">&#9675; ${lastSeen?('seen '+timeAgo(lastSeen)):'never seen'}</span>`;
}
function renderDiscovery(d){
  const disc = d.discovery || {total:0, online:0, by_type:[], by_source:[], assets:[], last_scan:null};
  const typeCatalog = {'Domain Controller':'var(--critical)','Server':'var(--high)','Desktop':'var(--accent)',
    'Laptop':'var(--low)','Workstation':'var(--medium)','Windows':'var(--accent)','Linux':'var(--low)',
    'NetworkDevice':'var(--medium)','Unknown':'var(--muted)'};
  const rows = disc.assets.length ? disc.assets.map(a=>`
    <tr class="clickable-row" onclick="openDeviceModal('${esc(a.Name||'').replace(/'/g,"\\'")}')">
      <td>${esc(a.Name||'')}</td><td>${esc(a.IP||'')}</td><td>${esc(a.AssetType||'')}</td>
      <td>${esc(a.OS||'')}</td><td>${esc(a.Source||'')}</td><td>${onlineBadge(a.LastSeen)}</td></tr>`).join('')
    : '<tr><td colspan="6" class="empty">No discovery scan has been run yet</td></tr>';
  return `
   <h2>Network Discovery <span class="fresh">${disc.online}/${disc.total} online now · updated ${timeAgo(disc.last_scan)}</span></h2>
   <div class="grid" style="grid-template-columns:.9fr 1.6fr; flex:1; min-height:0">
     <div class="panel">
       <div class="ph">${disc.total} asset(s) by type</div>
       ${hbars(disc.by_type, (lab)=>typeCatalog[lab]||'var(--accent)')}
       <div class="ph" style="margin-top:1.1rem">By discovery source</div>
       ${hbars(disc.by_source, ()=>'var(--low)')}
     </div>
     <div class="panel" style="display:flex;flex-direction:column;min-height:0">
       <div class="ph">Discovered assets ${disc.assets.length<disc.total?`(showing ${disc.assets.length} of ${disc.total})`:''} &middot; click a row for installed software</div>
       <div style="overflow:auto">
         <table class="mini"><thead><tr><th>Name</th><th>IP</th><th>Type</th><th>OS</th><th>Source</th><th>Status</th></tr></thead>
           <tbody>${rows}</tbody></table>
       </div>
     </div>
   </div>`;
}

const RENDERERS = [renderOverview, renderDiscovery, renderCompliance, renderThreats, renderCerts, renderSoftware];

function renderAll(){
  if(!data) return;
  SCREENS.forEach((sc,i)=>{ try{ sc.innerHTML = RENDERERS[i](data); }catch(e){ sc.innerHTML='<div class="empty">render error</div>'; } });
  document.getElementById('demoBadge').style.display = data.demo ? 'inline-block' : 'none';
}

/* ── Rotation ─────────────────────────────────────────────────────── */
function buildDots(){
  DOTS.innerHTML='';
  for(let i=0;i<N;i++){ const b=document.createElement('button');
    b.onclick=()=>go(i,true); DOTS.appendChild(b); }
}
function show(i){
  idx=(i+N)%N;
  SCREENS.forEach((s,j)=>s.classList.toggle('active', j===idx));
  [...DOTS.children].forEach((d,j)=>d.classList.toggle('on', j===idx));
  document.getElementById('screenName').textContent = SCREENS[idx].dataset.name.replace('&amp;','&');
}
function go(i,reset){ show(i); if(reset) tickStart=performance.now(); }
function tick(now){
  if(!paused){
    if(!tickStart) tickStart=now;
    const p=Math.min(1,(now-tickStart)/ROTATE_MS);
    document.getElementById('progressBar').style.width=(p*100)+'%';
    if(p>=1){ tickStart=now; show(idx+1); }
  } else { tickStart = now - 0; }
  rafId=requestAnimationFrame(tick);
}
function setPaused(v){ paused=v; document.getElementById('pausedFlag').style.display=v?'inline':'none'; if(!v) tickStart=performance.now(); }

/* ── Device detail modal ──────────────────────────────────────────── */
async function openDeviceModal(name){
  const backdrop = document.getElementById('deviceModal');
  const body = document.getElementById('deviceModalBody');
  document.getElementById('deviceModalTitle').textContent = name;
  body.innerHTML = '<div class="empty">Loading…</div>';
  backdrop.classList.remove('hidden');
  setPaused(true);
  try{
    const r = await fetch('/api/discovery/asset/' + encodeURIComponent(name), {cache:'no-store'});
    if(!r.ok){ body.innerHTML = '<div class="empty">No detail available for this device</div>'; return; }
    const a = await r.json();
    const sw = a.Software || [];
    const swRows = sw.length ? sw.map(s=>`
      <tr><td>${esc(s.Name||'')}</td><td>${esc(s.Version||'')}</td><td>${esc(s.Publisher||'')}</td>
        <td>${esc(s.Architecture||'')}</td></tr>`).join('')
      : '<tr><td colspan="4" class="empty">No software collected for this device yet (needs WinRM reachability)</td></tr>';
    body.innerHTML = `
      <div class="modal-meta">
        <div><div class="k">IP</div><div class="v">${esc(a.IP||'—')}</div></div>
        <div><div class="k">Type</div><div class="v">${esc(a.AssetType||'—')}</div></div>
        <div><div class="k">Source</div><div class="v">${esc(a.Source||'—')}</div></div>
        <div><div class="k">Status</div><div class="v">${onlineBadge(a.LastSeen)}</div></div>
      </div>
      <div class="ph">Installed software (${sw.length})</div>
      <table class="mini"><thead><tr><th>Name</th><th>Version</th><th>Publisher</th><th>Arch</th></tr></thead>
        <tbody>${swRows}</tbody></table>`;
  } catch(e){
    body.innerHTML = '<div class="empty">Failed to load device detail</div>';
  }
}
function closeDeviceModal(){
  document.getElementById('deviceModal').classList.add('hidden');
  setPaused(false);
}
addEventListener('keydown', e=>{ if(e.key==='Escape') closeDeviceModal(); });

/* ── Data ─────────────────────────────────────────────────────────── */
async function refresh(){
  try{ const r=await fetch('/api/dashboard',{cache:'no-store'}); data=await r.json(); renderAll(); }
  catch(e){ /* keep last data */ }
}

/* Clock */
setInterval(()=>{ document.getElementById('clock').textContent=new Date().toLocaleTimeString(); },1000);

/* Keyboard */
addEventListener('keydown',e=>{
  if(e.code==='Space'){ e.preventDefault(); setPaused(!paused); }
  else if(e.code==='ArrowRight'){ go(idx+1,true); }
  else if(e.code==='ArrowLeft'){ go(idx-1,true); }
  else if(e.key==='f'||e.key==='F'){ if(!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }
});
/* Pause on pointer hover over stage (so operators can read) */
document.getElementById('stage').addEventListener('mouseenter',()=>setPaused(true));
document.getElementById('stage').addEventListener('mouseleave',()=>setPaused(false));

/* Init */
buildDots();
refresh().then(()=>{ show(0); tickStart=performance.now(); rafId=requestAnimationFrame(tick); });
setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>
