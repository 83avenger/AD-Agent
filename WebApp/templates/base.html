<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}DC Anomaly Agent{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --brand-dark:  #1a2332;
      --brand-mid:   #2d4a6e;
      --brand-light: #e8f0fa;
      --accent:      #3b82f6;
      --critical:    #ef4444;
      --high:        #f97316;
      --medium:      #eab308;
      --low:         #3b82f6;
      --success:     #22c55e;
      --surface:     #f8fafc;
      --border:      #e2e8f0;
      --text:        #1e293b;
      --muted:       #64748b;
      --radius:      8px;
      --shadow:      0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
      --shadow-lg:   0 10px 15px -3px rgba(0,0,0,.1);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--surface);
      color: var(--text);
      min-height: 100vh;
    }

    /* Nav */
    nav {
      background: var(--brand-dark);
      padding: .9rem 2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      box-shadow: var(--shadow-lg);
    }
    nav .logo {
      color: white;
      font-size: 1.1rem;
      font-weight: 700;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: .5rem;
    }
    nav .logo svg { opacity: .85; }

    /* Layout */
    .container { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem; }

    /* Cards */
    .card {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .card-header {
      font-size: 1rem;
      font-weight: 600;
      color: var(--brand-mid);
      margin-bottom: 1rem;
      padding-bottom: .5rem;
      border-bottom: 2px solid var(--brand-light);
      display: flex;
      align-items: center;
      gap: .5rem;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      padding: .55rem 1.2rem;
      border-radius: var(--radius);
      font-size: .875rem;
      font-weight: 500;
      cursor: pointer;
      border: none;
      text-decoration: none;
      transition: opacity .15s, transform .1s;
    }
    .btn:hover { opacity: .88; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn-primary   { background: var(--accent); color: white; }
    .btn-dark      { background: var(--brand-dark); color: white; }
    .btn-outline   { background: white; color: var(--brand-mid); border: 1px solid var(--border); }
    .btn-danger    { background: var(--critical); color: white; }
    .btn-success   { background: var(--success); color: white; }
    .btn-sm        { padding: .35rem .8rem; font-size: .8rem; }

    /* Severity badges */
    .badge {
      display: inline-block;
      padding: .2rem .55rem;
      border-radius: 99px;
      font-size: .72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .badge-critical { background: var(--critical); color: white; }
    .badge-high     { background: var(--high);     color: white; }
    .badge-medium   { background: var(--medium);   color: #1e293b; }
    .badge-low      { background: var(--low);       color: white; }

    /* Alert */
    .alert {
      padding: .9rem 1.1rem;
      border-radius: var(--radius);
      margin-bottom: 1rem;
      font-size: .9rem;
    }
    .alert-error { background: #fef2f2; border: 1px solid #fca5a5; color: #991b1b; }
    .alert-info  { background: #eff6ff; border: 1px solid #93c5fd; color: #1e40af; }
    .alert-demo  { background: #fefce8; border: 1px solid #fde68a; color: #92400e; }

    /* Tables */
    .tbl-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: .85rem; }
    th {
      background: var(--brand-mid);
      color: white;
      text-align: left;
      padding: .65rem .85rem;
      font-weight: 600;
      font-size: .8rem;
    }
    td { padding: .6rem .85rem; border-bottom: 1px solid var(--border); vertical-align: top; }
    tr:last-child td { border-bottom: none; }
    tr:nth-child(even) td { background: var(--surface); }

    /* Score ring area */
    .score-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .score-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.2rem 1rem;
      text-align: center;
      box-shadow: var(--shadow);
    }
    .score-card .num  { font-size: 2.2rem; font-weight: 800; color: var(--brand-dark); line-height: 1; }
    .score-card .lbl  { font-size: .78rem; color: var(--muted); margin-top: .3rem; }
    .score-card.good  .num { color: var(--success); }
    .score-card.warn  .num { color: var(--high); }
    .score-card.crit  .num { color: var(--critical); }

    /* Remediation box */
    .remediation {
      background: #f0fdf4;
      border-left: 3px solid var(--success);
      padding: .6rem .9rem;
      font-size: .82rem;
      color: #166534;
      margin-top: .4rem;
      border-radius: 0 4px 4px 0;
    }

    /* Form elements */
    label  { font-size: .875rem; font-weight: 500; color: var(--text); display: block; margin-bottom: .3rem; }
    textarea, input[type=text] {
      width: 100%;
      padding: .55rem .85rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: .875rem;
      font-family: inherit;
      background: var(--surface);
      color: var(--text);
      transition: border-color .15s;
    }
    textarea:focus, input[type=text]:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59,130,246,.15); }

    .checkbox-group { display: flex; flex-wrap: wrap; gap: .6rem; }
    .checkbox-chip {
      position: relative;
    }
    .checkbox-chip input { position: absolute; opacity: 0; width: 0; height: 0; }
    .checkbox-chip label {
      display: inline-block;
      padding: .35rem .9rem;
      border: 1.5px solid var(--border);
      border-radius: 99px;
      font-size: .82rem;
      font-weight: 500;
      cursor: pointer;
      background: white;
      color: var(--muted);
      transition: all .15s;
      user-select: none;
      margin: 0;
    }
    .checkbox-chip input:checked + label {
      border-color: var(--accent);
      background: var(--accent);
      color: white;
    }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem; }
    @media (max-width: 640px) { .form-grid { grid-template-columns: 1fr; } }

    /* Tabs */
    .tabs { display: flex; gap: 2px; border-bottom: 2px solid var(--border); margin-bottom: 1.2rem; }
    .tab-btn {
      padding: .6rem 1.2rem;
      font-size: .875rem;
      font-weight: 500;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      transition: color .15s, border-color .15s;
    }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* Download bar */
    .dl-bar {
      display: flex;
      flex-wrap: wrap;
      gap: .6rem;
      align-items: center;
      background: var(--brand-light);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: .9rem 1.2rem;
      margin-bottom: 1.5rem;
    }
    .dl-bar span { font-size: .875rem; color: var(--brand-mid); font-weight: 600; flex: 1; }

    /* Detail collapsible */
    details { margin-top: .35rem; }
    summary { cursor: pointer; font-size: .8rem; color: var(--accent); list-style: none; }
    summary::before { content: "▶ "; font-size: .65rem; }
    details[open] summary::before { content: "▼ "; }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>

<nav>
  <a href="/" class="logo">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
    </svg>
    DC Anomaly Agent
  </a>
</nav>

<div class="container">
  {% block content %}{% endblock %}
</div>

{% block scripts %}{% endblock %}
</body>
</html>
